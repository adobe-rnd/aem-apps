<!DOCTYPE html>
<!-- ml-plugin rev: 2026-04-28-rev3 — NX imports from da.live (main); View Source must match after deploy -->
<html lang="en" data-ml-plugin-rev="2026-04-28-rev3">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Media Library · plugin rev3</title>
  <link rel="stylesheet" href="media-library.css">

  <script type="importmap">
    {
      "imports": {
        "da-lit": "https://da.live/nx/deps/lit/dist/index.js"
      }
    }
  </script>
</head>
<body>
  <div class="nx-app">
    <main id="ml-container"></main>
  </div>

  <script type="module">
    const PLUGIN_REV = '2026-06-27-medialib2';
    console.info(`[ml-plugin] ${PLUGIN_REV}`);

    // Support ?ref=branch parameter for testing (e.g., ?ref=medialib2, ?ref=local)
    const params = new URLSearchParams(window.location.search);
    const ref = params.get('ref') || 'main';

    let daOrigin;
    if (ref === 'main') {
      daOrigin = 'https://da.live';
    } else {
      // Load from branch: ?ref=medialib2 → https://medialib2--da--da.aem.page
      daOrigin = `https://${ref}--da--da.aem.page`;
    }

    console.log(`[ml-plugin] Loading from: ${daOrigin} (ref=${ref})`);

    import { setConfig } from `${daOrigin}/nx/scripts/nexter.js`;
    import DA_SDK from `${daOrigin}/nx/utils/sdk.js`;

    setConfig({ imsClientId: 'da-web', env: 'prod' });

    await import(`${daOrigin}/nx/blocks/media-library/media-library.js`);

    const { context } = await DA_SDK;
    const ml = document.createElement('nx-media-library');
    const org = context?.org;
    const repo = context?.repo;
    ml.sitePath = org && repo ? `/${org}/${repo}` : '';

    document.getElementById('ml-container').appendChild(ml);
  </script>
</body>
</html>
