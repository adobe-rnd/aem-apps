<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 336" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="round-trip-title round-trip-desc" id="round-trip-root">
        <title id="round-trip-title">Schema round trip</title>
        <desc id="round-trip-desc">Data flow showing a DA document unwrapped to JSON Schema, parsed into the authoring model that the UI edits, then serialized and wrapped back for saving, with lint checking the model on every edit and the SC SDK checking the JSON on save.</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #round-trip-root { --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #round-trip-root { font-family: var(--font-sans); color: var(--color-ink); }
      #round-trip-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#round-trip-root .diagram-container { overflow-x: visible; }
}</style>
