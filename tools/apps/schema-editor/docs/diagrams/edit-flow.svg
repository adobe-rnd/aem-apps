<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 648" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="edit-flow-title edit-flow-desc" id="edit-flow-root">
        <title id="edit-flow-title">One edit, then save</title>
        <desc id="edit-flow-desc">Sequence showing a view dispatching a command to the SchemaStore, which runs the pure model command, records history, relints and broadcasts state, then on save checks the schema with the SC SDK and writes it to DA only when there are no errors.</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #edit-flow-root { --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #edit-flow-root { font-family: var(--font-sans); color: var(--color-ink); }
      #edit-flow-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#edit-flow-root .diagram-container { overflow-x: visible; }
}</style>
