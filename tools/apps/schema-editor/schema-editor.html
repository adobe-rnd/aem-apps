<!DOCTYPE html>
<html>
  <head>
    <title>Schema Editor</title>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <link rel="icon" href="data:,">
    <script>
      // The DA SDK comes from the same nx build as the shell that hosts the app
      // (?nx=local or ?nx=<branch>, as on da.live), so their handshake matches.
      (() => {
        const imports = { 'da-lit': '/tools/deps/lit/dist/index.js' };
        const nx = new URLSearchParams(window.location.search).get('nx')
          ?.toLowerCase().replace(/[^a-z0-9-]/g, '-');
        if (nx) {
          const origin = nx === 'local' ? 'http://localhost:6456' : `https://${nx}--da-nx--adobe.aem.live`;
          imports['https://da.live/nx/utils/sdk.js'] = `${origin}/nx/utils/sdk.js`;
        }
        const map = document.createElement('script');
        map.type = 'importmap';
        map.textContent = JSON.stringify({ imports });
        document.currentScript.after(map);
      })();
    </script>
    <link rel="stylesheet" href="https://da.live/nx2/styles/styles.css">
    <style>
      body {
        margin: 0;
        background-color: light-dark(#fff, #000);
        color: var(--s2-gray-1000);
        font-family: var(--s2-font-family);
        font-size: var(--s2-body-size-m);
        height: 100vh;
        overflow: hidden;
        line-height: var(--s2-body-line-height);
      }
    </style>
    <!-- An import, not a src, so the import map above can redirect it. -->
    <script type="module">import 'https://da.live/nx/utils/sdk.js';</script>
    <script src="/tools/apps/schema-editor/schema-editor.js" type="module"></script>
  </head>
  <body>
  </body>
</html>
