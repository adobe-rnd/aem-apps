scalar Date

scalar Time

scalar DateTime

type Project @contentType(id: "project") {
  path: String!
  title: String
  data: ProjectData
}

type ProjectData {
  title: String
  slug: String
  summary: String
  status: String
  priority: Int
  score: Float
  publishDate: Date
  publishedAt: DateTime
  dailyStandup: Time
  archived: Boolean
  ownerId: String
  tags: [String]
  owner: ProjectContact
  collaborators: [ProjectContact]
  milestones: [ProjectMilestone]
  links: [ProjectLink]
}

type ProjectContact {
  name: String
  email: String
  address: ProjectAddress
}

type ProjectAddress {
  street: String
  city: String
  country: String
}

type ProjectMilestone {
  name: String
  completed: Boolean
  owner: ProjectContact
}

type ProjectLink {
  label: String
  url: String
}
