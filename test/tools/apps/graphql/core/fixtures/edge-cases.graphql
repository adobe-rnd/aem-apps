"""Arbitrary JSON value."""
scalar JSON

"""Original JSON key when it differs from the GraphQL field name."""
directive @source(key: String!) on FIELD_DEFINITION

"""
Structured Content schema id (document metadata.schemaName) backing a query field.
"""
directive @schema(id: String!) on FIELD_DEFINITION

type PageInfo {
  endCursor: String
  hasNextPage: Boolean!
  total: Int
}

"""Structured Content document metadata."""
type Metadata {
  """DA path of the document."""
  path: String!
  """Schema id of the document."""
  schemaName: String!
  """Document title."""
  title: String
}

type Query {
  """List Menu documents."""
  menuList(first: Int = 20, after: String): MenuConnection! @schema(id: "menu")
  """Get a single Menu document by its DA path."""
  menuByPath(path: String!): MenuItem @schema(id: "menu")
}

"""Menu entry"""
type MenuEntry {
  """First name"""
  first_name: String @source(key: "first-name")
  """Node"""
  tree: MenuNode
  """Extra"""
  extra: JSON
  missing: JSON
  """Matrix"""
  matrix: [[Float]]
  """No type"""
  unknown: JSON
}

"""Node"""
type MenuNode {
  """Label"""
  label: String
  """Children"""
  children: [MenuNode]
}

"""A Menu document."""
type MenuItem {
  """Document metadata."""
  metadata: Metadata!
  """Structured content of the document."""
  data: [MenuEntry]
}

"""A page of Menu documents."""
type MenuConnection {
  items: [MenuItem!]!
  pageInfo: PageInfo!
}
