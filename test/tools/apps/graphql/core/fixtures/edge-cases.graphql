scalar JSON

type Menu @contentType(id: "menu") {
  path: String!
  title: String
  data: [MenuEntry]
}

type MenuEntry {
  first_name: String @source(key: "first-name")
  tree: MenuNode
  extra: JSON
  missing: JSON
  matrix: [[Float]]
  unknown: JSON
}

type MenuNode {
  label: String
  children: [MenuNode]
}
